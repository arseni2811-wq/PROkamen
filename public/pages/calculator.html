<!doctype html>
<html lang="ru" data-calculator-mode="public">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Рассчитайте ориентировочную стоимость столешницы или подоконника из камня." />

    <link rel="stylesheet" href="../css/calculator.css" />
