<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Цены на материалы — ERP | PRO Камень</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/ui/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #f9fafb;
        --text-main: #1f2937;
        --text-muted: #6b7280;
        --border: #e5e7eb;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Manrope", sans-serif;
        background: var(--bg-color);
        color: var(--text-main);
        padding: 40px 20px;
      }

      .container {
        max-width: 960px;
        margin: 0 auto;
      }

      h1 {
        font-size: 28px;
        font-weight: 800;
        margin-bottom: 6px;
      }

      .subtitle {
        color: var(--text-muted);
        margin-bottom: 24px;
      }

      .table-info {
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 12px;
      }

      .data-table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 10px 30px -15px rgba(0, 0, 0, 0.15);
      }

      .data-table th,
      .data-table td {
        padding: 12px 16px;
        text-align: left;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
      }

      .data-table thead th {
        background: #1f2937;
        color: #fff;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 0.4px;
      }

      .data-table tbody tr:nth-child(even) {
        background: #f9fafb;
      }

      .data-table tbody tr:hover {
        background: #f3f4f6;
      }

      .data-table tbody tr:last-child td {
        border-bottom: none;
      }

      .price-error {
        display: flex;
        flex-direction: column;
        gap: 4px;
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 14px;
        padding: 18px 20px;
        color: #991b1b;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Каталог материалов и цены</h1>
      <p class="subtitle">
        Данные загружаются из <code>public/assets/data/price.csv</code> и
        отрисовываются скриптом <code>public/js/app.js</code>.
      </p>

      <div id="table-container"><!-- сюда вставляется таблица --></div>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
