<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRO-Management - База клиентов</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-[#F8F9FA] text-gray-800 antialiased pb-12">
    <header class="bg-[#212529] text-white sticky top-0 z-50 shadow-md">
      <div
        class="px-6 py-4 flex items-center justify-between max-w-7xl mx-auto"
      >
        <div class="flex items-center gap-4">
          <div class="text-xl font-bold text-[#D4AF37]">PRO-Management</div>
          <span
            class="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider"
            >База клиентов</span
          >
        </div>
        <div class="flex items-center gap-6">
          <span class="text-sm text-gray-300"
            >Пользователь:
            <span id="userName" class="font-bold text-white"></span
          ></span>
          <button
            id="logoutBtn"
            class="text-gray-300 hover:text-white text-sm font-medium transition"
          >
            Выйти
          </button>
        </div>
      </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
      <div
        class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4"
      >
        <a
          href="dashboard.html"
          class="text-blue-600 hover:text-blue-800 font-medium text-sm flex items-center gap-1 transition-colors w-max"
        >
          <span>&larr;</span> Назад на доску
        </a>

        <div class="relative w-full sm:w-96">
          <div
            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
          >
            <span class="text-gray-400">🔍</span>
          </div>
          <input
            type="text"
            id="searchClientInput"
            placeholder="Поиск по имени, телефону или email..."
            class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#D4AF37] focus:border-transparent shadow-sm"
          />
        </div>
      </div>

      <div
        class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6"
        id="clientsStats"
      ></div>

      <div
        class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden"
      >
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr
                class="bg-gray-100 text-gray-500 text-xs uppercase tracking-wider border-b border-gray-200"
              >
                <th class="p-4 font-bold">Клиент</th>
                <th class="p-4 font-bold">Контакты</th>
                <th class="p-4 font-bold text-center">Кол-во заказов</th>
                <th class="p-4 font-bold text-right">Сумма покупок (LTV)</th>
                <th class="p-4 font-bold text-center">Действия</th>
              </tr>
            </thead>
            <tbody
              id="clientsTableBody"
              class="divide-y divide-gray-100 bg-white"
            ></tbody>
          </table>
        </div>
      </div>
    </div>

    <div
      id="clientHistoryModal"
      class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex items-center justify-center p-4"
    >
      <div
        class="bg-white rounded-xl shadow-2xl w-full max-w-3xl overflow-hidden flex flex-col max-h-[90vh]"
      >
        <div
          class="bg-gray-800 text-white px-6 py-4 flex justify-between items-center"
        >
          <h2 class="text-lg font-bold flex items-center gap-2">
            <span>📂</span> История заказов:
            <span id="modalClientName" class="text-[#D4AF37]"></span>
          </h2>
          <button
            id="closeModalBtn"
            class="text-gray-400 hover:text-white transition text-2xl leading-none"
          >
            &times;
          </button>
        </div>
        <div class="p-6 overflow-y-auto bg-gray-50 flex-1">
          <div id="modalOrdersList" class="space-y-3"></div>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/clients.js"></script>
  </body>
</html>
